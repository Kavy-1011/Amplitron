name: Coverage CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  coverage-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            lcov gcovr cmake g++ \
            libgl1-mesa-dev \
            mesa-common-dev \
            freeglut3-dev \
            libglu1-mesa-dev \
            libsdl2-dev \
            portaudio19-dev \
            librtmidi-dev \
            pkg-config

      - name: Configure project
        run: |
          cmake -S . -B build -DENABLE_COVERAGE=ON -DCMAKE_BUILD_TYPE=Debug

      - name: Build project
        run: |
          cmake --build build -j

      - name: Run tests
        run: |
          cd build
          ctest --output-on-failure

      - name: Generate coverage
        run: |
          cd build
          lcov --capture --directory . --output-file coverage.info
          lcov --remove coverage.info '/usr/*' '*/external/*' '*/tests/*' \
            --output-file filtered.info

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build/filtered.info