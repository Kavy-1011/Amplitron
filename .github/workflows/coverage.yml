name: Coverage Pipeline

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ✅ IMPORTANT: install lcov (fix your error)
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y lcov gcovr cmake g++

      - name: Configure project
        run: cmake -S . -B build -DENABLE_COVERAGE=ON -DCMAKE_BUILD_TYPE=Debug

      - name: Build project
        run: cmake --build build -j

      - name: Run tests
        run: |
          cd build
          ctest --output-on-failure

      - name: Capture coverage
        run: |
          cd build
          lcov --capture --directory . --output-file coverage.info

      - name: Filter coverage
        run: |
          cd build
          lcov --remove coverage.info '/usr/*' '*/tests/*' '*/external/*' --output-file filtered.info

      - name: Coverage summary
        run: |
          cd build
          lcov --summary filtered.info

      # ✅ FAIL IF BELOW 60%
      - name: Enforce 60% coverage
        run: |
          COVERAGE=$(lcov --summary build/filtered.info | grep lines | awk '{print $2}' | sed 's/%//')
          echo "Coverage = $COVERAGE"

          if (( $(echo "$COVERAGE < 60" | bc -l) )); then
            echo "Coverage below 60% ❌"
            exit 1
          fi

      # ✅ upload report
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build