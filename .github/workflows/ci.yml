name: CI - Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [develop, main]

jobs:
  test-linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential cmake lcov \
            libportaudio2 portaudio19-dev libsdl2-dev \
            libgl1-mesa-dev libglu1-mesa-dev librtmidi-dev

      - name: Build
        run: |
          mkdir -p build
          cd build
          cmake ..
          make -j$(nproc)

      - name: Run tests
        run: cd build && ./amplitron-tests

      - name: Coverage
        run: |
          cd build
          lcov --capture --directory . --output-file coverage.info
          lcov --remove coverage.info '/usr/*' --output-file filtered.info
          lcov --summary filtered.info

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: build/filtered.info

  test-macos:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install deps
        run: brew install portaudio sdl2 rtmidi

      - name: Build
        run: |
          mkdir -p build
          cd build
          cmake ..
          make -j$(sysctl -n hw.ncpu)

      - name: Run tests
        run: cd build && ./amplitron-tests