name: CI - Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [develop, main]

jobs:
  test-linux:
    name: Test on Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake \
            libportaudio2 portaudio19-dev \
            libsdl2-dev libgl1-mesa-dev libglu1-mesa-dev \
            librtmidi-dev lcov

      - name: Build
        run: |
          mkdir -p build && cd build
          cmake -DCMAKE_BUILD_TYPE=Release ..
          make -j$(nproc)

      - name: Run Tests
        run: cd build && ./amplitron-tests

      - name: Generate Coverage
        run: |
          cd build
          lcov --capture --ignore-errors mismatch --directory . --output-file coverage.info
          lcov --remove coverage.info '/usr/*' '*/external/*' '*/tests/*' --output-file filtered.info
          lcov --summary filtered.info

      - name: Upload Coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build/filtered.info

  test-macos:
    name: Test on macOS
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Dependencies
        run: brew install portaudio sdl2 rtmidi

      - name: Build
        run: |
          mkdir -p build && cd build
          cmake -DCMAKE_BUILD_TYPE=Release ..
          make -j$(sysctl -n hw.ncpu)

      - name: Run Tests
        run: cd build && ./amplitron-tests

      - name: Upload Coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-macos
          path: build/filtered.info